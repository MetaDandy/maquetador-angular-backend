
services:
  app:
    build: .
    container_name: fiber_app
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=maquetador_db
      - GOFLAGS=-buildvcs=false
    depends_on:
      - db
    volumes:
      - .:/app
      - /go/pkg/mod
      - ./tmp:/app/tmp

  db:
    image: postgres
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: maquetador_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
